name: Build K10 (camera preview fix)

on:
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    name: Build df-k10-camfix
    runs-on: ubuntu-latest
    container:
      image: espressif/idf:v6.1
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Build df-k10-camfix
        shell: bash
        run: |
          source "$IDF_PATH/export.sh"
          python scripts/build.py dfrobot/df-k10-camfix --name df-k10-camfix

      - name: Upload merged binary (artifact)
        uses: actions/upload-artifact@v4
        with:
          name: xiaozhi_df-k10_camfix_${{ github.sha }}
          path: build/merged-binary.bin
          if-no-files-found: error

      - name: Push binary to firmware-bin branch (for fast retrieval)
        shell: bash
        run: |
          cp build/merged-binary.bin merged-binary.bin
          git config user.email "camfix-bot@local"
          git config user.name "camfix-bot"
          git checkout -B firmware-bin
          git add merged-binary.bin
          git commit -m "xiaozhi df-k10-camfix merged-binary.bin" || echo "nothing to commit"
          git push -f origin firmware-bin
